<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gurtech-13</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d12;
      color: #e8ecf1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 640px;
      width: 90%;
      padding: 48px;
      border: 1px solid #23272f;
      border-radius: 16px;
      background: #11141b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.5px;
    }
    p {
      margin: 0 0 24px;
      color: #a9b1bc;
      line-height: 1.5;
    }
    a {
      color: #7dd3fc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    ul {
      padding-left: 18px;
      margin: 0;
      color: #cfd5de;
      line-height: 1.7;
    }
    footer {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #7d8793;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Gurtech-13</h1>
    <p>Personal site hosted on GitHub Pages.</p>
    <ul>
      <li>Projects</li>
      <li>Notes</li>
      <li>Contact</li>
    </ul>
    <footer>Built with plain HTML/CSS</footer>
  </main>
</body>
</html>
