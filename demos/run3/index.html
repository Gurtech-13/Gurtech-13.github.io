<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run 3</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="run3.css">
</head>
<body>
<div class="wrap demo-wrap">
<nav class="topnav"><a class="back" href="../../index.html">&larr; All projects</a></nav>

<canvas id="cv" width="1280" height="720" style="display:block;cursor:pointer"></canvas>
<div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;gap:8px;z-index:20">
  <button type="button" id="backbtn" style="font:inherit;cursor:pointer;background:rgba(15,23,42,.85);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;display:none;backdrop-filter:blur(6px)">&#8592; Menu</button>
  <button type="button" id="musicToggle" style="font:inherit;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:.82rem;display:none;backdrop-filter:blur(6px)" title="Toggle music (M)">&#127925;</button>
  <button type="button" id="sceneBtn" style="font:inherit;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:.82rem;display:none;backdrop-filter:blur(6px)" title="Cutscene gallery">&#127916;</button>
</div>

<div class="card" id="card"><div class="inner">
  <img class="card-img" id="cardimg" style="display:none" alt="">
  <h2 id="cardtitle"></h2><p id="cardtext"></p><p class="who" id="cardwho"></p>
  <button type="button" id="cardbtn">Continue</button>
</div></div>

<div class="card" id="shopview" style="display:none"><div class="inner" style="max-width:400px">
  <h2>&#x1F6D2; Power Cell Shop</h2>
  <p style="color:var(--muted);font-size:.85rem">Earn cells by clearing checkpoints.</p>
  <div class="shop-list"></div>
  <button type="button" id="shopClose" style="margin-top:12px;font:inherit;cursor:pointer;background:var(--accent);color:#04131d;font-weight:700;border:none;border-radius:999px;padding:8px 20px;width:100%">Close</button>
</div></div>

<div class="card" id="cutview"><div class="cutstage" id="cutstage">
  <div class="cuttitle" id="cuttitle"></div>
  <img class="cutactor left" id="cutleft" alt="">
  <img class="cutactor right" id="cutright" alt="">
  <div class="cutbubble" id="cutbubble"><p id="cuttext"></p></div>
  <div class="cutbar"><span id="cutprog"></span><button type="button" id="cutbtn">Continue &#9656;</button></div>
</div></div>

<div class="card" id="sceneMenu"><div class="inner" style="max-width:680px">
  <h2>&#127916; Cutscenes</h2>
  <p style="color:var(--muted);font-size:.85rem">Unlock scenes by playing. Click a seen scene to replay it.</p>
  <div class="scene-grid" id="sceneGrid"></div>
  <button type="button" id="sceneClose" style="margin-top:12px;font:inherit;cursor:pointer;background:var(--accent);color:#04131d;font-weight:700;border:none;border-radius:999px;padding:8px 20px;width:100%">Close</button>
</div></div>

<p id="status" class="statusline">Loading&hellip;</p>
</div>
<script src="story.js"></script>
<script src="cutscenes.js"></script>
<script src="custom_cutscenes.js"></script>
<script src="app.js"></script>
</body>
</html>
