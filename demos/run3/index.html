<!DOCTYPE html>
<html lang="en">

</head>
<body>
<div class="wrap demo-wrap">
<nav class="topnav"><a class="back" href="../../index.html">&larr; All projects</a></nav>
<!-- no version is written here: app.js paints this from the wasm's own build
     string (run3.c's RUN3_VERSION), so the label can only show the engine that
     is really loaded -->
<div id="ver" title="game version (from the engine)">v&hellip;</div>

<canvas id="cv" width="1280" height="720" style="display:block;cursor:pointer"></canvas>
<div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;gap:8px;z-index:20">
  <button type="button" id="backbtn" style="font:inherit;cursor:pointer;background:rgba(15,23,42,.85);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;display:none;backdrop-filter:blur(6px)">&#8592; Menu</button>
  <button type="button" id="musicToggle" style="font:inherit;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:.82rem;display:none;backdrop-filter:blur(6px)" title="Toggle music (M)">&#127925;</button>
  <button type="button" id="sceneBtn" style="font:inherit;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:.82rem;display:none;backdrop-filter:blur(6px)" title="Cutscene gallery">&#127916;</button>
  <button type="button" id="achBtn" style="font:inherit;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:.82rem;display:none;backdrop-filter:blur(6px)" title="Achievements">&#127942;</button>
</div>

<div class="card" id="card"><div class="inner">
  <img class="card-img" id="cardimg" style="display:none" alt="">
  <h2 id="cardtitle"></h2><p id="cardtext"></p><p class="who" id="cardwho"></p>
  <button type="button" id="cardbtn">Continue</button>
  <button type="button" id="cardbtn2" style="display:none">Buy</button>
</div></div>

<div class="card" id="shopview" style="display:none"><div class="inner" style="max-width:400px">
  <h2>&#x1F6D2; Power Cell Shop</h2>
  <p style="color:var(--muted);font-size:.85rem">Earn cells by clearing checkpoints.</p>
  <div class="shop-list"></div>
  <button type="button" id="shopClose" style="margin-top:12px;font:inherit;cursor:pointer;background:var(--accent);color:#04131d;font-weight:700;border:none;border-radius:999px;padding:8px 20px;width:100%">Close</button>
</div></div>

<div class="card" id="cutview"><div class="cutstage" id="cutstage">
  <div class="cuttitle" id="cuttitle"></div>
  <div class="cutbubble" id="cutbubble"><p id="cuttext"></p></div>
  <div class="cutbar"><span id="cutprog"></span><button type="button" id="cutbtn">Continue &#9656;</button></div>
</div></div>

<div class="card" id="sceneMenu"><div class="inner" style="max-width:680px">
  <h2>&#127916; Cutscenes</h2>
  <p style="color:var(--muted);font-size:.85rem">Unlock scenes by playing. Click a seen scene to replay it.</p>
  <div class="scene-grid" id="sceneGrid"></div>
  <button type="button" id="sceneClose" style="margin-top:12px;font:inherit;cursor:pointer;background:var(--accent);color:#04131d;font-weight:700;border:none;border-radius:999px;padding:8px 20px;width:100%">Close</button>
</div></div>

<div class="card" id="achMenu"><div class="inner" style="max-width:560px">
  <h2>&#127942; Achievements</h2>
  <p style="color:var(--muted);font-size:.85rem" id="achSub">Earn 8 to unlock something strange...</p>
  <div class="ach-list" id="achList"></div>
  <button type="button" id="achClose" style="margin-top:12px;font:inherit;cursor:pointer;background:var(--accent);color:#04131d;font-weight:700;border:none;border-radius:999px;padding:8px 20px;width:100%">Close</button>
</div></div>

<p id="status" class="statusline">Loading&hellip;</p>
</div>
<script>
/* ===== HOST ASSET LOADER =====
   The host scripts and the engine are one build, so they must never be paired
   across versions: a stale app.js against a fresh run3.wasm is exactly the
   "I rebuilt but nothing changed" failure, and it is invisible because the
   ENGINE reports the new version while the old host code runs.

   Nothing here knows the version number. The token is a property of the build:
   the newest Last-Modified across the engine AND the host assets, read with
   HEAD (headers only - the 31 MB body is never fetched). So it changes when any
   part of the build changes, including JS-only edits that leave the wasm
   alone, and a reload always fetches the matching set. The number the player
   sees is still painted from the loaded wasm, never from here.

   If the server exposes no validator, a per-load timestamp is used instead:
   correct, just uncacheable. This script is deliberately tiny and stable so
   that being cached itself is harmless. */
(function () {
  var ASSETS = ["story.js", "cutscenes.js", "custom_cutscenes.js",
                "achievements.js", "app.js"];
  var PROBE = ASSETS.concat(["run3.wasm"]);
  function load(tok) {
    var q = "?v=" + encodeURIComponent(tok);
    var css = document.querySelector('link[href="run3.css"]');
    if (css) css.href = "run3.css" + q;
    for (var i = 0; i < ASSETS.length; i++) {
      var s = document.createElement("script");
      s.async = false;              /* dynamic scripts default to async: keep order */
      s.src = ASSETS[i] + q;
      document.head.appendChild(s);
    }
  }
  var done = false;
  function go(tok) { if (done) return; done = true; load(tok || String(Date.now())); }
  /* safety net: never leave the page blank if the probes hang */
  setTimeout(function () { go(""); }, 2000);
  try {
    Promise.all(PROBE.map(function (f) {
      return fetch(f, { method: "HEAD", cache: "no-store" }).then(function (r) {
        return r.headers.get("last-modified") || r.headers.get("etag") || "";
      }).catch(function () { return ""; });
    })).then(function (vals) {
      var newest = 0;
      for (var i = 0; i < vals.length; i++) {
        var d = Date.parse(vals[i]);
        if (d > newest) newest = d;
      }
      go(newest > 0 ? String(newest) : "");
    }).catch(function () { go(""); });
  } catch (e) { go(""); }
})();
</script>
</body>
</html>
